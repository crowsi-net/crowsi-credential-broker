[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-credential-broker"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Fail-closed local credential references, leases, and metadata-only status contracts"
license = "Apache-2.0"
readme = "README.md"
publish = ["ecosystem-private"]
autotests = false
default-run = "crowsi-credential"
repository = "https://github.com/crowsi-net/crowsi-credential-broker"

[package.metadata.crowsi]
boundary = "credential-custody"
status-schema = "crowsi://credentials/status/v1"
status-contains-secret-values = false

[workspace]
members = ["."]
resolver = "3"

[dependencies]
crowsi-control-contracts = { version = "=0.1.0", registry = "ecosystem-private" }
crowsi-windows-custody-provider = { version = "=0.10.0", registry = "ecosystem-private" }
getrandom = "0.3.4"
hex = "0.4.3"
nix = { version = "0.29.0", features = ["poll"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.18"
zeroize = "=1.8.2"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "crowsi-credential"
path = "src/bin/crowsi-credential.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[[test]]
name = "contracts"
path = "tests/harnesses/contracts.rs"

[[test]]
name = "ipc"
path = "tests/harnesses/ipc.rs"
